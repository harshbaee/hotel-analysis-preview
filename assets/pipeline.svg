<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 212" width="1280" height="212" role="img" aria-label="From a copied database to a checked report, in five steps">
  <title>From a copied database to a checked report, in five steps</title>
  <style>
    .step { animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; }
    .s2 { animation-delay: .15s; } .s3 { animation-delay: .3s; } .s4 { animation-delay: .45s; } .s5 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    .flow { stroke-dasharray: 6 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    .ring { opacity: 0; animation: pulse 7.5s ease-in-out infinite; }
    .r2 { animation-delay: 1.5s; } .r3 { animation-delay: 3s; } .r4 { animation-delay: 4.5s; } .r5 { animation-delay: 6s; }
    @keyframes pulse { 0%, 22%, 100% { opacity: 0; } 8%, 14% { opacity: 1; } }
    .name { font: 700 18px "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2A32; }
    .figure { font: 700 40px "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2A32; letter-spacing: -1px; }
    .note { font: 500 14px "Segoe UI", Helvetica, Arial, sans-serif; fill: #3E4B55; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ring { opacity: 0; } }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#26323B"/>
    </marker>
  </defs>
  <g stroke="#26323B" stroke-width="2.5" fill="none" marker-end="url(#head)">
    <line class="flow" x1="222" y1="106" x2="260" y2="106"/>
    <line class="flow" x1="488" y1="106" x2="526" y2="106"/>
    <line class="flow" x1="754" y1="106" x2="792" y2="106"/>
    <line class="flow" x1="1020" y1="106" x2="1058" y2="106"/>
  </g>
  <g class="step s1">
    <rect x="0" y="10" width="216" height="192" rx="20" fill="#DCEBF7"/>
    <rect class="ring" x="2" y="12" width="212" height="188" rx="19" fill="none" stroke="#4F8FC9" stroke-width="3"/>
    <text class="name" x="22" y="48">Extract</text>
    <text class="figure" x="20" y="104">83</text>
    <text class="note" x="22" y="134">tables exported to CSV,</text>
    <text class="note" x="22" y="154">read-only</text>
  </g>
  <g class="step s2">
    <rect x="266" y="10" width="216" height="192" rx="20" fill="#DDF2E9"/>
    <rect class="ring r2" x="268" y="12" width="212" height="188" rx="19" fill="none" stroke="#5DB08F" stroke-width="3"/>
    <text class="name" x="288" y="48">Clean</text>
    <text class="figure" x="286" y="104">4</text>
    <text class="note" x="288" y="134">Python notebooks:</text>
    <text class="note" x="288" y="154">explore, clean, validate,</text>
    <text class="note" x="288" y="174">cost the menu</text>
  </g>
  <g class="step s3">
    <rect x="532" y="10" width="216" height="192" rx="20" fill="#FCEFD6"/>
    <rect class="ring r3" x="534" y="12" width="212" height="188" rx="19" fill="none" stroke="#E3A93C" stroke-width="3"/>
    <text class="name" x="554" y="48">Model</text>
    <text class="figure" x="552" y="104">126</text>
    <text class="note" x="554" y="134">DAX measures, 35 tables,</text>
    <text class="note" x="554" y="154">29 relationships</text>
  </g>
  <g class="step s4">
    <rect x="798" y="10" width="216" height="192" rx="20" fill="#FBE3DD"/>
    <rect class="ring r4" x="800" y="12" width="212" height="188" rx="19" fill="none" stroke="#E58C7A" stroke-width="3"/>
    <text class="name" x="820" y="48">Report</text>
    <text class="figure" x="818" y="104">10</text>
    <text class="note" x="820" y="134">Power BI pages, one</text>
    <text class="note" x="820" y="154">question per page</text>
  </g>
  <g class="step s5">
    <rect x="1064" y="10" width="216" height="192" rx="20" fill="#ECE7F8"/>
    <rect class="ring r5" x="1066" y="12" width="212" height="188" rx="19" fill="none" stroke="#9C8ADB" stroke-width="3"/>
    <text class="name" x="1086" y="48">Verify</text>
    <text class="figure" x="1084" y="104">1,722</text>
    <text class="note" x="1086" y="134">checks against the</text>
    <text class="note" x="1086" y="154">raw data, all passing</text>
  </g>
</svg>
