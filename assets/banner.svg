<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Hotel analysis: one year of a 57-room hotel in the Vendée">
  <title>Hotel analysis: one year of a 57-room hotel in the Vendée</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEBF7"/>
      <stop offset="0.55" stop-color="#DDF2E9"/>
      <stop offset="1" stop-color="#FCEFD6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .blob { animation: drift 14s ease-in-out infinite alternate; }
    .b2 { animation-duration: 19s; animation-delay: -7s; }
    .b3 { animation-duration: 23s; animation-delay: -3s; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(70px, -36px); } }
    .wheel { animation: turn 48s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .paddle { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes grow { from { transform: scaleY(0); opacity: 0; } }
    .rise { animation: rise 1s cubic-bezier(.2, .8, .2, 1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .75s; } .d5 { animation-delay: 1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .title { font: 500 78px Georgia, "Times New Roman", serif; fill: #1F2A32; letter-spacing: -1.5px; }
    .sub { font: 500 23px "Segoe UI", Helvetica, Arial, sans-serif; fill: #3E4B55; }
    .eyebrow { font: 700 13px "Segoe UI", Helvetica, Arial, sans-serif; fill: #3E4B55; letter-spacing: 1.6px; }
    .chip { font: 700 15px "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2A32; }
    .credit { font: 600 15px "Segoe UI", Helvetica, Arial, sans-serif; fill: #3E4B55; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#ground)"/>
    <g filter="url(#soft)" opacity="0.8">
      <circle class="blob" cx="990" cy="70" r="170" fill="#BFDCF2"/>
      <circle class="blob b2" cx="720" cy="380" r="150" fill="#F6CFC6"/>
      <circle class="blob b3" cx="1220" cy="350" r="140" fill="#F8E2B4"/>
    </g>

    <g class="rise d1">
      <rect x="62" y="54" width="268" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85"/>
      <text class="eyebrow" x="196" y="75" text-anchor="middle">INTERNSHIP PROJECT · 2025/2026</text>
    </g>
    <text class="title rise d2" x="58" y="172">Hotel analysis</text>
    <text class="sub rise d3" x="62" y="218">One year of a 57-room hotel in the Vendée,</text>
    <text class="sub rise d3" x="62" y="250">October 2025 to September 2026, read from its own systems.</text>
    <g class="rise d4">
      <rect x="62" y="282" width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.9"/>
      <text class="chip" x="142" y="304" text-anchor="middle">Python · pandas</text>
      <rect x="232" y="282" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.9"/>
      <text class="chip" x="307" y="304" text-anchor="middle">Power BI · DAX</text>
      <rect x="392" y="282" width="178" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.9"/>
      <text class="chip" x="481" y="304" text-anchor="middle">React Three Fiber</text>
      <rect x="580" y="282" width="140" height="34" rx="17" fill="#26323B"/>
      <text class="chip" x="650" y="304" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">1,722 checks</text>
    </g>
    <text class="credit rise d5" x="62" y="360">Harsh Prajapati &amp; Charmi Shah · Master 2 Recherche, CY Tech</text>

    <!-- The mill wheel: twelve paddles, one per month from October at the top, each as long as that month was full. -->
    <g transform="translate(1012 200)">
      <g class="wheel">
      <g transform="rotate(0)"><rect class="paddle" style="animation-delay:0.15s" x="-9" y="-119.1" width="18" height="41.1" rx="2" fill="#E3A93C"/></g>
      <g transform="rotate(30)"><rect class="paddle" style="animation-delay:0.22s" x="-9" y="-94.8" width="18" height="16.8" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(60)"><rect class="paddle" style="animation-delay:0.29s" x="-9" y="-100.3" width="18" height="22.3" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(90)"><rect class="paddle" style="animation-delay:0.36s" x="-9" y="-103.0" width="18" height="25.0" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(120)"><rect class="paddle" style="animation-delay:0.43s" x="-9" y="-101.8" width="18" height="23.8" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(150)"><rect class="paddle" style="animation-delay:0.50s" x="-9" y="-104.0" width="18" height="26.0" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(180)"><rect class="paddle" style="animation-delay:0.57s" x="-9" y="-106.5" width="18" height="28.5" rx="2" fill="#4F8FC9"/></g>
      <g transform="rotate(210)"><rect class="paddle" style="animation-delay:0.64s" x="-9" y="-128.9" width="18" height="50.9" rx="2" fill="#E3A93C"/></g>
      <g transform="rotate(240)"><rect class="paddle" style="animation-delay:0.71s" x="-9" y="-171.7" width="18" height="93.7" rx="2" fill="#E58C7A"/></g>
      <g transform="rotate(270)"><rect class="paddle" style="animation-delay:0.78s" x="-9" y="-159.0" width="18" height="81.0" rx="2" fill="#E58C7A"/></g>
      <g transform="rotate(300)"><rect class="paddle" style="animation-delay:0.85s" x="-9" y="-145.1" width="18" height="67.1" rx="2" fill="#E58C7A"/></g>
      <g transform="rotate(330)"><rect class="paddle" style="animation-delay:0.92s" x="-9" y="-150.0" width="18" height="72.0" rx="2" fill="#E58C7A"/></g>
        <circle r="78" fill="none" stroke="#26323B" stroke-width="11"/>
        <circle r="46" fill="none" stroke="#26323B" stroke-width="5"/>
        <g stroke="#26323B" stroke-width="4" stroke-linecap="round">
          <line x1="0" y1="-74" x2="0" y2="74"/>
          <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(30)"/>
          <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(60)"/>
          <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(90)"/>
          <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(120)"/>
          <line x1="0" y1="-74" x2="0" y2="74" transform="rotate(150)"/>
        </g>
        <circle r="14" fill="#26323B"/>
      </g>
    </g>
  </g>
</svg>
